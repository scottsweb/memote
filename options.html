<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>Memote</title>
		<link rel="stylesheet" href="css/options.css" />
	</head>

	<body>
		<div id="notify">
			<span id="notifyText" class=""></span>
		</div>

		<div class="title">
			<h1>Memote</h1>
			<h2>Configure Keyboard Shortcuts</h2>
		</div>

		<div class="card">
			<div class="setting-area">
				<div class="setting" id="navUp" data-type="shortcut">
					<span class="setting-description"> Navigate Up </span>
				</div>
				<div class="setting" id="navLeft" data-type="shortcut">
					<span class="setting-description"> Navigate Left </span>
				</div>
				<div class="setting" id="navDown" data-type="shortcut">
					<span class="setting-description"> Navigate Down </span>
				</div>
				<div class="setting" id="navRight" data-type="shortcut">
					<span class="setting-description"> Navigate Right </span>
				</div>
				<div class="setting" id="jump" data-type="shortcut">
					<span class="setting-description">
						Jump (Show / Hide Jump Keys)
					</span>
				</div>
				<div class="setting" id="click" data-type="shortcut">
					<span class="setting-description"> Click </span>
				</div>
				<div class="setting" id="home" data-type="shortcut">
					<span class="setting-description"> Go Home (Hold 1 Sec) </span>
				</div>
				<div class="setting" id="disableKeys" data-type="shortcut">
					<span class="setting-description"> Disable Shortcuts </span>
				</div>
			</div>
		</div>

		<div class="reset-area">
			<div class="btn reset">
				<span class="btn-text"> Reset All Settings to Defaults </span>
			</div>
		</div>

		<script type="text/javascript" src="js/defaults.js"></script>
		<script type="text/javascript" src="js/options.js"></script>
	</body>
</html>
